[package]
name = "kiln"
version = "0.2.0"
edition = "2021"
description = "Bridge between a FHIR Location registry and GeoParquet"
license = "Apache-2.0"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "geospatial"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
geojson = "1"
geo = "0.33"
geo-types = "0.7"
wkb = "0.9"
base64 = "0.22"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
