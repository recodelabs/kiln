[project]
name = "kiln"
version = "0.1.0"
description = "Export FHIR Locations to partitioned GeoParquet"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.1",
    "geopandas>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
]

[project.scripts]
kiln = "kiln.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
